# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  # Automatic Approvals: CodeRabbit approves a PR once its review of the latest
  # commit is clean, its threads are resolved, and its pre-merge checks pass.
  # The repo's branch rules require 1 approval before merge; this lets a clean
  # CodeRabbit review satisfy it.
  auto_approvals:
    enabled: true
  path_instructions:
    - path: "**/*.ts"
      instructions: |
        Review against these repository conventions:
        - TypeScript uses type aliases (type X = ...), never interfaces. Do not suggest converting a type alias to an interface; flag newly added interfaces.
        - New data surfaces need explicit error and empty states: no silent spinners, and no empty-result message shown when a load has failed.
        - New behavior needs a regression test that fails without the change.
        - Behavior changes should update the "Run when" triggers in docs/manual-tests.md.
    - path: "**/*.tsx"
      instructions: |
        Review against these repository conventions:
        - TypeScript uses type aliases (type X = ...), never interfaces. Do not suggest converting a type alias to an interface; flag newly added interfaces.
        - All styling lives in the @spudly/ui design system and is applied through semantic props. Flag Tailwind classes or style props added in app code. Do not suggest adding styling props to design-system components - they own their styles completely.
        - New interactive elements need an accessible name/label; icon-only controls must be labeled.
        - New data surfaces need explicit error and empty states: no silent spinners, and no empty-result message shown when a load has failed.
        - New behavior needs a regression test that fails without the change.
        - Behavior changes should update the "Run when" triggers in docs/manual-tests.md.
    - path: "packages/core/**"
      instructions: |
        Search-identity invariant: each chunk of a document is its own memorizable item with persisted source identity. Flag changes that collapse chunks into a single item, and changes that match or reuse cards across different chunks. Snippet-to-full-text matching must stay within the same chunk.
    - path: "package-lock.json"
      instructions: |
        package-lock.json is never hand-edited; it is regenerated with the pinned npm (the packageManager field in package.json, currently npm@10.9.4). Do not nitpick generated lockfile diffs. Flag only a lockfile change that looks hand-edited or inconsistent with package.json.
