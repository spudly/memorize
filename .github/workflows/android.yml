name: android

# Phase 1 of #29: PR CI must build the Android app. The Expo app uses the
# managed workflow (no committed android/ directory), so this job generates
# the native project with `expo prebuild` and compiles it with Gradle.
# Without it, native-side breaks (Expo / RN / AGP upgrades) are invisible
# until someone builds locally or tries to ship.
#
# Phase 2 (emulator use-case tests) is tracked in #29 and not part of this
# job yet.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # The path filter that used to sit on the workflow trigger lives in
  # this job instead. A workflow-level `paths:` filter means the
  # workflow never runs on PRs that don't touch the app, so the build
  # check never reports — and a required check that never reports
  # blocks merges. Detecting the paths in a job lets the build report
  # "skipped" and the android-gate below report on every PR.
  # The heavy build runs only for app-affecting paths: the app package
  # (packages/app/** — source, app.json, its manifest), the root
  # package.json / package-lock.json (dependency and packageManager
  # pins), and this workflow file itself. A skip is announced in the
  # job log and in the run summary so it never looks like a lost run.
  changes:
    name: Detect Android-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-build: ${{ steps.detect.outputs.run-build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant paths
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run-build=true" >> "$GITHUB_OUTPUT"
            echo "### Android build: running (manual dispatch always builds)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          echo "Changed files:"
          echo "$changed"
          # App-affecting paths: the app package, the root manifests,
          # and this workflow. Everything else (web, workspace
          # libraries, docs, other workflows) skips the heavy build.
          pattern='^(packages/app/|package\.json$|package-lock\.json$|\.github/workflows/android\.yml$)'
          if echo "$changed" | grep -Eq "$pattern"; then
            echo "run-build=true" >> "$GITHUB_OUTPUT"
            echo "### Android build: running (app-affecting paths changed)" >> "$GITHUB_STEP_SUMMARY"
            echo "$changed" | grep -E "$pattern" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run-build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android build skipped: no app-affecting paths changed (packages/app/**, package.json, package-lock.json, .github/workflows/android.yml)."
            echo "### Android build: skipped (no app-affecting paths changed)" >> "$GITHUB_STEP_SUMMARY"
          fi

  android-build:
    name: Build Android release APK
    needs: changes
    if: needs.changes.outputs.run-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Enable Corepack (pinned npm)
        run: corepack enable npm

      # @spudly/ui lives on GitHub Packages; the workflow GITHUB_TOKEN has
      # no read_package grant for it (cold-cache npm ci fails 403), so use
      # the repo's PACKAGES_READ_TOKEN secret like Eciperay does.
      - name: Install dependencies
        run: npm ci
        env:
          CI: true
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      # Workspace packages (@memorize/core, @memorize/types) resolve to
      # dist/ builds that are not committed — build them first or Metro
      # cannot resolve them when bundling the release JS.
      - name: Build workspace dependencies of the app
        run: npx turbo run build --filter=@memorize/app^...

      # Generated android/ is throwaway CI output — never committed.
      - name: Generate native project (expo prebuild)
        working-directory: packages/app
        run: npx expo prebuild --platform android --no-install
        env:
          CI: true

      # Same JDK/Android SDK pattern as Eciperay's android-build-setup
      # composite action (temurin 17; SDK versions match Expo SDK 58's
      # generated project: compileSdk 36, build-tools 36.0.0, NDK 27).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Restore Gradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json',
            'packages/app/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The generated template signs release builds with the debug
      # keystore, so assembleRelease works in CI without signing secrets.
      - name: Build release APK
        working-directory: packages/app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: memorize-app-release-apk
          path: packages/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # Always-reporting gate for branch protection: reports on every PR,
  # fails only when the changes detection or the build failed or was
  # cancelled, and passes when the build succeeded or was legitimately
  # skipped (no Android-relevant paths in the PR).
  android-gate:
    name: android-gate
    needs: [changes, android-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
