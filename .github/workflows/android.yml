name: android

# Phase 1 of #29: PR CI must build the Android app. The Expo app uses the
# managed workflow (no committed android/ directory), so this job generates
# the native project with `expo prebuild` and compiles it with Gradle.
# Without it, native-side breaks (Expo / RN / AGP upgrades) are invisible
# until someone builds locally or tries to ship.
#
# Since 2026-11-02 the build runs only on release PRs (head branch
# changeset-release/**): native breaks now surface on the release PR
# instead of the PR that caused them. That tradeoff was accepted
# deliberately to keep ordinary PR loops fast. See the `changes` job.
#
# Phase 2 of #29 (the android-usecases job below) installs the release
# APK the build job produced on an emulator and runs the Maestro
# use-case flows in packages/app/maestro: app launch, scripture search
# + passage display, the word-blanking drill (render + peek input),
# and session persistence across an app restart. No API key is
# configured in CI, so the app runs on its bundled demo data — the
# suite is self-contained and never touches the live API or an
# account. It inherits the build's gating (release PRs + manual
# dispatch): ordinary PRs skip it, and android-gate still reports.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # The branch gate lives in this job instead of on the workflow
  # trigger. A workflow-level branch filter means the workflow never
  # runs on other PRs, so the build check never reports — and a
  # required check that never reports blocks merges. Deciding in a
  # job lets the build report "skipped" and the android-gate below
  # report on every PR.
  # The heavy build runs only on release PRs: PRs whose head branch
  # starts with changeset-release/ (the changesets Pending Release
  # PR). Until 2026-11-02 it ran for app-affecting paths
  # (packages/app/**, packages/core/**, packages/types/**, the root
  # manifests, this workflow); restricting it to release PRs keeps
  # ordinary PR loops fast, at the accepted cost of native breaks
  # surfacing on the release PR. Manual dispatch always builds, as
  # an explicit escape hatch. A skip is announced in the job log and
  # in the run summary so it never looks like a lost run.
  changes:
    name: Detect Android-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-build: ${{ steps.detect.outputs.run-build }}
    steps:
      - name: Detect release PR
        id: detect
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run-build=true" >> "$GITHUB_OUTPUT"
            echo "### Android build: running (manual dispatch always builds)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # HEAD_REF is the PR's head branch name. Git ref names
          # cannot contain ':' or control characters, so echoing it
          # cannot inject workflow commands into this job's log.
          case "$HEAD_REF" in
            changeset-release/*)
              echo "run-build=true" >> "$GITHUB_OUTPUT"
              echo "### Android build: running (release PR, head branch $HEAD_REF)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "run-build=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Android build skipped: the build runs only on release PRs (head branch changeset-release/**); this PR's head branch is $HEAD_REF."
              echo "### Android build: skipped (not a release PR)" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

  android-build:
    name: Build Android release APK
    needs: changes
    if: needs.changes.outputs.run-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Enable Corepack (pinned npm)
        run: corepack enable npm

      # @spudly/ui lives on GitHub Packages; the workflow GITHUB_TOKEN has
      # no read_package grant for it (cold-cache npm ci fails 403), so use
      # the repo's PACKAGES_READ_TOKEN secret like Eciperay does.
      - name: Install dependencies
        run: npm ci
        env:
          CI: true
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      # Workspace packages (@memorize/core, @memorize/types) resolve to
      # dist/ builds that are not committed — build them first or Metro
      # cannot resolve them when bundling the release JS.
      - name: Build workspace dependencies of the app
        run: npx turbo run build --filter=@memorize/app^...

      # Generated android/ is throwaway CI output — never committed.
      - name: Generate native project (expo prebuild)
        working-directory: packages/app
        run: npx expo prebuild --platform android --no-install
        env:
          CI: true

      # Same JDK/Android SDK pattern as Eciperay's android-build-setup
      # composite action (temurin 17; SDK versions match Expo SDK 58's
      # generated project: compileSdk 36, build-tools 36.0.0, NDK 27).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Restore Gradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json',
            'packages/app/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The generated template signs release builds with the debug
      # keystore, so assembleRelease works in CI without signing secrets.
      - name: Build release APK
        working-directory: packages/app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: memorize-app-release-apk
          path: packages/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # Phase 2 of #29: run the Maestro use-case flows against the release
  # APK from the build job on a GitHub-hosted emulator. Gated by the
  # same run-build decision as the build (release PRs + manual
  # dispatch), so ordinary PRs skip it and the gate still reports.
  android-usecases:
    name: Run Android use-case tests (emulator)
    needs: [changes, android-build]
    if: needs.changes.outputs.run-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v7

      # The tested APK is exactly the release build android-build
      # produced and uploaded — no second Gradle build.
      - name: Download the release APK
        uses: actions/download-artifact@v7
        with:
          name: memorize-app-release-apk
          path: artifacts/apk

      # Maestro is a JVM CLI; temurin 17 matches the build job's JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Pinned CLI release (mobile-dev-inc/Maestro cli-2.12.1) so a
      # new upstream release cannot change suite behavior silently.
      - name: Install Maestro CLI (pinned 2.12.1)
        run: |
          curl -fsSL -o /tmp/maestro.zip \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip"
          sudo unzip -q /tmp/maestro.zip -d /opt/maestro
          echo "/opt/maestro/maestro/bin" >> "$GITHUB_PATH"

      # GitHub's ubuntu runners need this udev rule before the
      # emulator can use KVM acceleration.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the APK and run the use-case flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The stock 2-core / 3 GB emulator starves the system
          # server on the 4-vCPU runner — the Pixel Launcher ANRs
          # under the accessibility load and its modal dialog hides
          # the app's view hierarchy from Maestro (first proof run,
          # 2026-11-03). Give the emulator the whole runner.
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: >
            adb install -r artifacts/apk/app-release.apk &&
            maestro test packages/app/maestro
            --format junit --output maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: maestro-report.xml
          if-no-files-found: ignore

      # On failure Maestro leaves per-flow screenshots and logs under
      # ~/.maestro/tests — keep them so a red run is diagnosable
      # without a local emulator.
      - name: Upload Maestro failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-failure-evidence
          path: ~/.maestro/tests
          if-no-files-found: ignore

  # Always-reporting gate for branch protection: reports on every PR,
  # fails only when the changes detection, the build, or the use-case
  # tests failed or were cancelled, and passes when they succeeded or
  # were legitimately skipped (the PR is not a release PR).
  android-gate:
    name: android-gate
    needs: [changes, android-build, android-usecases]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the changes job reported a decision
        env:
          RUN_BUILD: ${{ needs.changes.outputs.run-build }}
        run: |
          if [ "$RUN_BUILD" != "true" ] && [ "$RUN_BUILD" != "false" ]; then
            echo "::error::The changes job reported no run-build decision ('$RUN_BUILD'); a missing decision is not a pass."
            exit 1
          fi
          echo "run-build decision: $RUN_BUILD"
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
