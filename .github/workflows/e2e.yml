name: e2e

# Playwright web integration tests (issues #30, #45). Unit tests never load the
# real app in a browser; this job builds the web package and exercises the
# core flows in Chromium — demo-mode flows offline, and gospel-engine
# flows against fixture-mocked /api responses (no live engine, no real
# account). See packages/web/playwright.config.ts.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # The path filter that used to sit on the workflow trigger lives in
  # this job instead. A workflow-level `paths:` filter means the
  # workflow never runs on PRs that don't touch the web app, so the
  # e2e check never reports — and a required check that never reports
  # blocks merges. Detecting the paths in a job lets the e2e job
  # report "skipped" and the e2e-gate below report on every PR.
  changes:
    name: Detect e2e-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-e2e: ${{ steps.detect.outputs.run-e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect relevant paths
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -Eq '^(packages/web/|packages/core/|packages/types/|package-lock\.json$|\.github/workflows/e2e\.yml$)'; then
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Playwright web e2e
    needs: changes
    if: needs.changes.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Enable Corepack (pinned npm)
        run: corepack enable

      # @spudly/ui lives on GitHub Packages; the workflow GITHUB_TOKEN has
      # no read_package grant for it (cold-cache npm ci fails 403), so use
      # the repo's PACKAGES_READ_TOKEN secret (same pattern as android.yml).
      - name: Install dependencies
        run: npm ci
        env:
          CI: true
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

      # Workspace packages (@memorize/core, @memorize/types) resolve to
      # dist/ builds that are not committed — build them before Vite can
      # bundle the web app.
      - name: Build workspace dependencies of the web app
        run: npx turbo run build --filter=@memorize/web^...

      - name: Install Chromium for Playwright
        working-directory: packages/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: packages/web
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: packages/web/test-results
          if-no-files-found: ignore

  # Always-reporting gate for branch protection: reports on every PR,
  # fails only when the changes detection or the e2e job failed or was
  # cancelled, and passes when the e2e job succeeded or was
  # legitimately skipped (no e2e-relevant paths in the PR).
  e2e-gate:
    name: e2e-gate
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
