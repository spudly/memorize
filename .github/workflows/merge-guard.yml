name: merge-guard

# The merge guard lives in its own workflow so that editing a PR body
# (e.g. checking off pre-merge checklist items) re-runs only this
# cheap check. When the job lived in ci.yml, the `edited` trigger had
# to sit on the CI workflow, so every body edit re-ran the whole
# build; now a push runs the build exactly once and a body edit
# re-runs only this guard. The check is a required status check in
# the repo's "Require CI before merge" ruleset.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # Merge guard: fails while the PR body still contains unchecked
  # task-list items, so the pre-merge checklist in the PR template is
  # enforced by the gate instead of by convention alone. An item
  # struck through (~~...~~) counts as waived, matching the template's
  # "checked or struck through with a reason" rule. Fenced code blocks
  # and HTML comments are ignored, so quoting a checklist in prose or
  # in the template's guidance comments doesn't trip the guard.
  # Dependabot PRs are exempt: their bodies quote upstream changelogs
  # that can contain task lists nobody here owns.
  # Self-referential items are also exempt: "CI is green for the exact
  # head commit" can only become true once ci-gate passes, and ci-gate
  # needs this job — requiring that box here would deadlock every PR.
  # Green CI itself is still enforced by the ruleset's required checks.
  merge-guard:
    name: merge-guard
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
      - name: Check for unchecked task-list items
        run: |
          node <<'SCRIPT'
          const fs = require('node:fs');
          const body = fs.readFileSync(process.env.RUNNER_TEMP + '/pr-body.md', 'utf8');
          // Drop fenced code blocks (``` or ~~~) line by line.
          let inFence = false;
          const kept = [];
          for (const line of body.split('\n')) {
            if (/^\s*(`{3,}|~{3,})/.test(line)) {
              inFence = !inFence;
              continue;
            }
            if (!inFence) kept.push(line);
          }
          // Drop HTML comments, then look for unchecked task items.
          const text = kept.join('\n').replace(/<!--[\s\S]*?-->/g, '');
          // Self-referential items are not required: "CI is green for
          // the exact head commit" depends on ci-gate, which needs this
          // job, so it can never be honestly checked before the guard
          // passes. The ruleset's required checks enforce green CI.
          const selfReferential = /^\s*[-*+]\s+\[\s\]\s+CI is green for the exact head commit\s*$/;
          const items = text
            .split('\n')
            .filter((line) => /^\s*[-*+]\s+\[\s\]\s+\S/.test(line) && !line.includes('~~'));
          const unchecked = items.filter((line) => !selfReferential.test(line));
          if (items.length > unchecked.length) {
            console.log(`Ignored ${items.length - unchecked.length} self-referential checklist item(s); they are exempt from this guard (see the merge-guard comment in merge-guard.yml).`);
          }
          if (unchecked.length > 0) {
            console.log('::error::Unchecked task-list items remain in the PR body:');
            for (const line of unchecked) console.log(line);
            console.log('Check each item off, or strike it through (~~...~~) with a one-line reason, per the PR template.');
            process.exit(1);
          }
          console.log('All task-list items in the PR body are complete.');
          SCRIPT
