name: ci

on:
  # Push runs only on main: a feature-branch push that also has an open PR
  # otherwise runs CI twice for the same commit (push + pull_request).
  # PR branches are covered by the pull_request trigger below.
  push:
    branches: [main]
  # No `edited` type here on purpose: PR-body edits only need to
  # re-run the merge guard, which lives in merge-guard.yml — putting
  # `edited` on this workflow re-ran the whole build on every edit.
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs for the same PR/branch so fix-pushes don't burn
# minutes on already-obsolete work. Keyed by PR number (not branch name)
# so fork PRs that happen to share a branch name can't cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      # package-lock.json is committed (this PR): install with npm ci so CI
      # validates the committed lockfile instead of resolving a fresh tree,
      # matching the android and e2e jobs.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx turbo build --filter=@memorize/web

  # Copy-paste detection in WARN MODE (memorize#117, Phase 1): reports
  # duplication to the job summary but can never fail a PR — the step is
  # continue-on-error, this job is NOT in ci-gate's needs, and no threshold
  # is configured. Enforcement (Phase 3) flips this in its own PR.
  jscpd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - name: Report duplication (warn mode — never blocks)
        continue-on-error: true
        run: |
          npm run jscpd -- --output "${RUNNER_TEMP}/jscpd-report"
          jq -r '.statistics.total | "## jscpd duplication (warn mode, memorize#117 Phase 1)\n\n| Files analyzed | Total lines | Clones found | Duplicated lines | Duplicated tokens |\n|---|---|---|---|---|\n| \(.sources) | \(.lines) | \(.clones) | \(.duplicatedLines) (\(.percentage * 100 | round / 100))% | \(.duplicatedTokens) (\(.percentageTokens * 100 | round / 100))% |"' "${RUNNER_TEMP}/jscpd-report/jscpd-report.json" >> "$GITHUB_STEP_SUMMARY"

  # Dead-code detection in WARN MODE (memorize#116, Phase 1): reports
  # findings to the job summary but can never fail a PR — the step is
  # continue-on-error, this job is NOT in ci-gate's needs, and no
  # threshold is configured. Enforcement (Phase 3) flips this in its
  # own PR.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - name: Report dead code (warn mode — never blocks)
        continue-on-error: true
        run: |
          npm run knip > "${RUNNER_TEMP}/knip-report.txt" 2>&1 || true
          {
            echo "## knip dead-code report (warn mode, memorize#116 Phase 1)"
            echo
            grep -E '\([0-9]+\)$' "${RUNNER_TEMP}/knip-report.txt" | sed 's/^/- /'
            echo
            echo "<details><summary>Full report</summary>"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/knip-report.txt"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # Always-reporting gate for branch protection: needs every job in
  # this workflow and reports on every run. It fails only when a needed
  # job failed or was cancelled, and passes when the rest succeeded or
  # were legitimately skipped.
  ci-gate:
    name: ci-gate
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
