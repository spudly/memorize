name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      # NOTE: package-lock.json is not committed yet (see README). Use npm install
      # until the lockfile is added, then switch back to npm ci.
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx turbo build --filter=@memorize/web