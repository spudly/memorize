name: ci

on:
  # Push runs only on main: a feature-branch push that also has an open PR
  # otherwise runs CI twice for the same commit (push + pull_request).
  # PR branches are covered by the pull_request trigger below.
  push:
    branches: [main]
  # No `edited` type here on purpose: PR-body edits only need to
  # re-run the merge guard, which lives in merge-guard.yml — putting
  # `edited` on this workflow re-ran the whole build on every edit.
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs for the same PR/branch so fix-pushes don't burn
# minutes on already-obsolete work. Keyed by PR number (not branch name)
# so fork PRs that happen to share a branch name can't cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      # package-lock.json is committed (this PR): install with npm ci so CI
      # validates the committed lockfile instead of resolving a fresh tree,
      # matching the android and e2e jobs.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run workflows:lint
      - run: npm run check-drift
      - run: npm run test
      - run: npx turbo build --filter=@memorize/web

  # Copy-paste detection in ENFORCE MODE (memorize#117, Phase 3): the
  # Phase 2 burn-down (#123) set the baseline at 40 clones / 671
  # duplicated lines (8.08% of lines), and .jscpd.json now carries
  # threshold: 9 — this job blocks PRs whose duplication share rises
  # above that threshold. It IS in ci-gate's needs and its step exits
  # with jscpd's own status.
  jscpd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - name: Check duplication (enforce mode — blocks above threshold)
        run: |
          set +e
          npm run jscpd -- --output "${RUNNER_TEMP}/jscpd-report"
          jscpd_status=$?
          set -e
          jq -r '.statistics.total | "## jscpd duplication (enforce mode, memorize#117 Phase 3; threshold 9%)\n\n| Files analyzed | Total lines | Clones found | Duplicated lines | Duplicated tokens |\n|---|---|---|---|---|\n| \(.sources) | \(.lines) | \(.clones) | \(.duplicatedLines) (\(.percentage * 100 | round / 100))% | \(.duplicatedTokens) (\(.percentageTokens * 100 | round / 100))% |"' "${RUNNER_TEMP}/jscpd-report/jscpd-report.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$jscpd_status"

  # Dead-code detection in ENFORCE MODE (memorize#116, Phase 3): the
  # Phase 2 burn-down (#121) took the baseline to zero findings, so
  # this job now blocks PRs — it IS in ci-gate's needs and its step
  # exits with knip's own status, failing on any new dead code.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - name: Check dead code (enforce mode — blocks on findings)
        env:
          # Knip loads packages/web/vite.config.ts from the repo root,
          # where Lingui's cwd-based config search finds no config and
          # knip exits 2 on the load error even with zero findings (the
          # Phase 1–2 warn mode masked this). Point Lingui at the web
          # package's config for this run only; Vite's own runs, whose
          # cwd is packages/web, are unaffected.
          LINGUI_CONFIG: ${{ github.workspace }}/packages/web/lingui.config.js
        run: |
          set +e
          npm run knip > "${RUNNER_TEMP}/knip-report.txt" 2>&1
          knip_status=$?
          set -e
          {
            echo "## knip dead-code report (enforce mode, memorize#116 Phase 3)"
            echo
            grep -E '\([0-9]+\)$' "${RUNNER_TEMP}/knip-report.txt" | sed 's/^/- /' || true
            echo
            echo "<details><summary>Full report</summary>"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/knip-report.txt"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$knip_status"

  # Always-reporting gate for branch protection: needs every blocking
  # job in this workflow and reports on every run. It fails only when
  # a needed job failed or was cancelled, and passes when the rest
  # succeeded or were legitimately skipped.
  ci-gate:
    name: ci-gate
    needs: [ci, knip, jscpd]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
