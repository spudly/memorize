# Phase 2 of #29: the installed app launches to its initial screen
# (the Verses tab) without crashing and shows the empty state.
appId: com.memorize.app
---
- launchApp:
    clearState: true
# A freshly booted emulator can show a system "isn't responding"
# (ANR) dialog over the app; its window hides the app's hierarchy
# from Maestro. Dismiss it if present (no-op otherwise).
- runFlow:
    when:
      visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "My verses"
    timeout: 30000
- assertVisible: "Memorize"
- assertVisible: "No verses yet"
- assertVisible: "Find one in the Search tab to get started."
- assertVisible: "^Verses$"
- assertVisible: "^Search$"
- assertVisible: "^Review$"
- assertVisible: "^Settings$"
