# Phase 2 of #29: the installed app launches to its initial screen
# (the Verses tab) without crashing and shows the empty state.
appId: com.memorize.app
---
- launchApp:
    clearState: true
# A freshly booted emulator can show a system "isn't responding"
# (ANR) dialog over the app — "Quickstep isn't responding" on the
# AOSP image, "Pixel Launcher isn't responding" on google_apis;
# its window hides the app's hierarchy from Maestro (#94). The
# selector names system titles only, so an ANR of the app itself
# ("Memorize isn't responding") still fails the flow instead of
# being dismissed. The dismissal polls while the target below is
# not yet visible: runFlow's `when` is evaluated once and
# waitForAnimationToEnd returns as soon as the UI is static, so a
# fixed number of early checks could all finish before a dialog
# that appears mid-wait (no-op when no dialog shows).
- repeat:
    times: 10
    while:
      notVisible: "My verses"
    commands:
      - runFlow:
          when:
            visible: ".*(Quickstep|Launcher|System UI) isn't responding.*"
          commands:
            - tapOn: "Wait"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "My verses"
    timeout: 30000
- assertVisible: "Memorize"
- assertVisible: "No verses yet"
- assertVisible: "Find one in the Search tab to get started."
- assertVisible: "^Verses$"
- assertVisible: "^Search$"
- assertVisible: "^Review$"
- assertVisible: "^Settings$"
